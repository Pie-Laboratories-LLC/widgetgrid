<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="769" viewBox="0 0 1024 769">
  <!-- Ported from ~/fred.html (Browser Claude's preview harness): the
       animation CSS lived in that page's head, targeting the SVG from
       outside. Folded in here as the SVG's own internal style element
       instead, required for this file to animate when loaded via img src,
       since an img-embedded SVG is a sandboxed standalone document with no
       access to the host page's stylesheets (but DOES run its own internal
       CSS, including animations). Dropped fred.html's .stage/html/body
       rules, since those were just its preview stand-in background, not
       part of the overlay; SplashWidget.vue already provides the real one.
       Everything else (animation names, timings, colors, content) is
       unchanged. -->
  <style>
    text {
      font-family: 'Georgia', 'Times New Roman', serif;
      font-weight: 700;
      text-anchor: middle;
      opacity: 0;
      transform-box: fill-box;
      transform-origin: center;
    }

    .word {
      fill: #f4ead9;
      animation: spinLand 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }

    #word-pie   { animation-delay: 0s; }
    #word-labs  { animation-delay: 0.75s; }
    #word-llc   { animation-delay: 1.5s; }

    /* clickie appears 1.5s after the last word (LLC) lands, i.e. at 1.5s + 1.5s = 3.0s */
    #word-clickie {
      animation:
        spinLand 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) 3.0s forwards,
        rainbow 4s linear 3.6s infinite;
      letter-spacing: 2px;
    }

    @keyframes spinLand {
      0% {
        opacity: 0;
        transform: rotate(-540deg) scale(0.2);
      }
      70% {
        opacity: 1;
        transform: rotate(15deg) scale(1.08);
      }
      100% {
        opacity: 1;
        transform: rotate(0deg) scale(1);
      }
    }

    @keyframes rainbow {
      0%   { fill: #ff5c5c; }
      16%  { fill: #ff9b3d; }
      33%  { fill: #ffe066; }
      50%  { fill: #7ee787; }
      66%  { fill: #6bc4ff; }
      83%  { fill: #b48bff; }
      100% { fill: #ff5c5c; }
    }

    /* bold-letter cycling: 8 letters in "clickie…" (c l i c k i e .) cycle over 3.2s */
    @keyframes boldCycle {
      0%, 87.5%, 100% { font-weight: 700; }
      /* each letter gets a ~0.4s window of bold-900 within its own offset via animation-delay below */
    }

    .letter {
      animation: boldPulse 3.2s steps(1) infinite;
    }
    @keyframes boldPulse {
      0%   { font-weight: 900; }
      12.5% { font-weight: 700; }
      100% { font-weight: 700; }
    }
    #l0 { animation-delay: 0s; }
    #l1 { animation-delay: 0.4s; }
    #l2 { animation-delay: 0.8s; }
    #l3 { animation-delay: 1.2s; }
    #l4 { animation-delay: 1.6s; }
    #l5 { animation-delay: 2.0s; }
    #l6 { animation-delay: 2.4s; }
    #l7 { animation-delay: 2.8s; }

    @media (prefers-reduced-motion: reduce) {
      .word, #word-clickie, .letter {
        animation: none !important;
        opacity: 1;
        transform: none;
      }
    }
  </style>

  <text id="word-pie"  class="word" x="512" y="300" font-size="88">Pie</text>
  <text id="word-labs" class="word" x="512" y="390" font-size="56" letter-spacing="4">Laboratories</text>
  <text id="word-llc"  class="word" x="512" y="450" font-size="40" letter-spacing="6">LLC</text>

  <text id="word-clickie" x="512" y="560" font-size="34">
    <tspan id="l0" class="letter">c</tspan><tspan id="l1" class="letter">l</tspan><tspan id="l2" class="letter">i</tspan><tspan id="l3" class="letter">c</tspan><tspan id="l4" class="letter">k</tspan><tspan id="l5" class="letter">i</tspan><tspan id="l6" class="letter">e</tspan><tspan id="l7" class="letter">.</tspan><tspan>..</tspan>
  </text>
</svg>
