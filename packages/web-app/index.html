<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pie Laboratories, LLC.</title>
    <!-- pie.ico also exists at /favicon.ico -- browsers probe that exact
         path directly regardless of this tag, so both need to exist. -->
    <link rel="icon" type="image/x-icon" href="/pie.ico" />
    <!-- Home Screen install (iOS only allows Web Push for a site added to the
         Home Screen; see public/sw.js and the chat widget's notifications
         control). -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Pie Labs" />
    <meta name="theme-color" content="#050505" />
    <!--
      Declared before the app's own module script so it's registered well
      before any widget's dynamic import() fires (those only happen later,
      on demand, as pass-1 layout data reveals which widget types are
      needed) -- this is the mechanism that makes the host app and every
      independently-built widget bundle resolve to the SAME Vue module
      instance. See packages/vite-widget-lib/externalizeVue.js.
    -->
    <script type="importmap">
      { "imports": { "vue": "/vendor/vue.esm-browser.prod.js" } }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
