syntax = "proto3";

package widgetgrid.v1;

// Sign-in itself happens in the browser against Cognito (hosted UI ->
// IAM Identity Center, authorization code + PKCE; see
// packages/auth-web). Every call then carries the Cognito access token as
// "authorization: Bearer <jwt>" (see authContext.js). This service only
// records the sign-in server-side: the users row, and for the owner, the
// presence session behind SubscribeOwnerPresence.

message RegisterSignInRequest {
  // The ID token from the same sign-in -- it carries the email the access
  // token doesn't. Verified server-side against the user pool.
  string id_token = 1;
}

message RegisterSignInResponse {
  // Presence session for Logout; empty unless the caller is the owner.
  string session_token = 1;
  string role = 2;
  // The user's public username; empty until they have one (see
  // account.proto).
  string username = 3;
}

message LogoutRequest {
  string token = 1;
}
message LogoutResponse {}

message SubscribeOwnerPresenceRequest {}

message OwnerPresenceEvent {
  bool online = 1;
}

service AuthService {
  rpc RegisterSignIn(RegisterSignInRequest) returns (RegisterSignInResponse);
  rpc Logout(LogoutRequest) returns (LogoutResponse);
  // Pushes on login/logout so every visitor's chat-icon greyed state
  // updates live, not just on their next page load. Same server-streaming
  // pattern as BlogService.SubscribeNewPosts.
  rpc SubscribeOwnerPresence(SubscribeOwnerPresenceRequest) returns (stream OwnerPresenceEvent);
}
