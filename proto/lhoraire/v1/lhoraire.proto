syntax = "proto3";

package lhoraire.v1;

// l'horaire: project-based, fully hierarchical issue tracking. Served by
// packages/lhoraire-server; every call needs a Cognito access token
// ("authorization: Bearer <jwt>") whose cognito:groups includes
// "anonyme admins". Timestamps are ISO-8601 strings, ids are UUIDs.
//
// Requests that would otherwise have no fields carry requested_at_ms: a
// zero-length gRPC-Web body gets silently dropped before reaching the
// server (see widgetgrid.v1 auth.proto's history of that bug).

message Project {
  string id = 1;
  // Issue key prefix: "ffdb" in ffdb-1. Lowercase letters/digits, 2-10
  // characters, starting with a letter. Immutable.
  string key = 2;
  string name = 3;
  // "#rrggbb"
  string color = 4;
  string created_at = 5;
  string modified_at = 6;
}

message ListProjectsRequest {
  int64 requested_at_ms = 1;
}
message ListProjectsResponse {
  repeated Project projects = 1;
}

message GetProjectRequest {
  string key = 1;
}
message GetProjectResponse {
  Project project = 1;
}

message CreateProjectRequest {
  string key = 1;
  string name = 2;
  string color = 3;
}
message CreateProjectResponse {
  Project project = 1;
}

message UpdateProjectRequest {
  string id = 1;
  string name = 2;
  string color = 3;
}
message UpdateProjectResponse {
  Project project = 1;
}

message DeleteProjectRequest {
  string id = 1;
}
message DeleteProjectResponse {}

service ProjectService {
  rpc ListProjects(ListProjectsRequest) returns (ListProjectsResponse);
  rpc GetProject(GetProjectRequest) returns (GetProjectResponse);
  rpc CreateProject(CreateProjectRequest) returns (CreateProjectResponse);
  // Name and colour only; the key never changes.
  rpc UpdateProject(UpdateProjectRequest) returns (UpdateProjectResponse);
  // Deletes the project with all its issues and project-specific types.
  rpc DeleteProject(DeleteProjectRequest) returns (DeleteProjectResponse);
}

// ---------------------------------------------------------------------------
// Issue types and workflows. A type is global (project_id empty) or belongs
// to one project, and owns exactly one workflow: its states and the allowed
// transitions between them.

message IssueType {
  string id = 1;
  // Empty = global.
  string project_id = 2;
  string name = 3;
  string icon = 4;
  // "#rrggbb"
  string color = 5;
  string created_at = 6;
  string modified_at = 7;
}

message WorkflowState {
  string id = 1;
  string name = 2;
  int32 position = 3;
  bool is_initial = 4;
  bool is_terminal = 5;
}

message WorkflowTransition {
  string from_state_id = 1;
  string to_state_id = 2;
}

message Workflow {
  repeated WorkflowState states = 1;
  repeated WorkflowTransition transitions = 2;
}

message ListIssueTypesRequest {
  // Empty = global types only. A project id = that project's own types,
  // plus the global ones when include_global is set (what an issue in the
  // project can use).
  string project_id = 1;
  bool include_global = 2;
  int64 requested_at_ms = 3;
}
message ListIssueTypesResponse {
  repeated IssueType issue_types = 1;
}

message GetIssueTypeRequest {
  string id = 1;
}
message GetIssueTypeResponse {
  IssueType issue_type = 1;
  Workflow workflow = 2;
}

message CreateIssueTypeRequest {
  // Empty = global.
  string project_id = 1;
  string name = 2;
  string icon = 3;
  string color = 4;
  // Start from a copy of this type's workflow (a global type, or a type in
  // the same project). Empty = the default New/Underway/Paused/Closed.
  string copy_workflow_from_type_id = 5;
}
message CreateIssueTypeResponse {
  IssueType issue_type = 1;
  Workflow workflow = 2;
}

message UpdateIssueTypeRequest {
  string id = 1;
  string name = 2;
  string icon = 3;
  string color = 4;
}
message UpdateIssueTypeResponse {
  IssueType issue_type = 1;
}

message MoveIssueTypeScopeRequest {
  string id = 1;
  // Empty = make it global. A project id = make it that project's own type
  // (only from global).
  string target_project_id = 2;
}
message MoveIssueTypeScopeResponse {
  IssueType issue_type = 1;
}

message GetIssueTypeUsageRequest {
  string id = 1;
}
message GetIssueTypeUsageResponse {
  // Issues of this type.
  int32 issue_count = 1;
  // Issues that would go if those issues were deleted with their subtrees.
  int32 deleted_with_subtrees_count = 2;
  // Issues per state id.
  map<string, int32> issues_per_state = 3;
}

message DeleteIssueTypeRequest {
  string id = 1;
  enum Mode {
    // Only allowed when no issue uses the type.
    MODE_UNSPECIFIED = 0;
    // Move its issues to reassign_to_type_id, mapping every state that has
    // issues through state_mapping (old state id -> new state id).
    REASSIGN = 1;
    // Delete its issues together with their subtrees.
    DELETE_ISSUES = 2;
  }
  Mode mode = 2;
  string reassign_to_type_id = 3;
  map<string, string> state_mapping = 4;
}
message DeleteIssueTypeResponse {
  int32 issues_reassigned = 1;
  int32 issues_deleted = 2;
}

// One state in an UpdateWorkflow request: an existing state's id, or a
// new state's placeholder "new:<anything>" that transitions can refer to.
// Order in the list is the display order.
message WorkflowStateInput {
  string id = 1;
  string name = 2;
  bool is_initial = 3;
  bool is_terminal = 4;
}

message UpdateWorkflowRequest {
  string issue_type_id = 1;
  repeated WorkflowStateInput states = 2;
  // From/to are state ids or "new:" placeholders from states above.
  repeated WorkflowTransition transitions = 3;
  // For every removed state that issues are in: removed state id -> id or
  // placeholder of the state to move them to.
  map<string, string> state_mapping = 4;
}
message UpdateWorkflowResponse {
  Workflow workflow = 1;
}

service IssueTypeService {
  rpc ListIssueTypes(ListIssueTypesRequest) returns (ListIssueTypesResponse);
  rpc GetIssueType(GetIssueTypeRequest) returns (GetIssueTypeResponse);
  rpc CreateIssueType(CreateIssueTypeRequest) returns (CreateIssueTypeResponse);
  rpc UpdateIssueType(UpdateIssueTypeRequest) returns (UpdateIssueTypeResponse);
  rpc MoveIssueTypeScope(MoveIssueTypeScopeRequest) returns (MoveIssueTypeScopeResponse);
  rpc GetIssueTypeUsage(GetIssueTypeUsageRequest) returns (GetIssueTypeUsageResponse);
  rpc DeleteIssueType(DeleteIssueTypeRequest) returns (DeleteIssueTypeResponse);
  // Replaces the type's whole workflow in one transaction.
  rpc UpdateWorkflow(UpdateWorkflowRequest) returns (UpdateWorkflowResponse);
}

// ---------------------------------------------------------------------------
// Issues. Keys are "<project key>-<number>" (ffdb-1); numbers are per
// project and never reused. Issues nest without limit; siblings keep a
// manual order.

message Issue {
  string id = 1;
  string project_id = 2;
  // "ffdb-1"
  string key = 3;
  int32 number = 4;
  // Empty = a root issue.
  string parent_id = 5;
  // Sorts siblings: compare as plain strings (byte order).
  string sibling_rank = 6;
  string issue_type_id = 7;
  string state_id = 8;
  string summary = 9;
  // Only filled by GetIssue; ListIssues leaves it empty to stay light.
  string description = 10;
  // na | minor | normal | serious | blocker
  string severity = 11;
  // Empty = unassigned.
  string assignee_id = 12;
  // Set exactly when the issue is in a terminal state:
  // completed | wont_complete | obsolete | already_addressed
  string end_reason = 13;
  string end_description = 14;
  string created_at = 15;
  string created_by = 16;
  string modified_at = 17;
  string modified_by = 18;
  // Send back on every write; a write against a stale version is
  // rejected (ABORTED) so concurrent edits are never silently lost.
  int32 version = 19;
}

message User {
  string id = 1;
  string email = 2;
}

message ListUsersRequest {
  int64 requested_at_ms = 1;
}
message ListUsersResponse {
  repeated User users = 1;
}

message ListIssuesRequest {
  string project_id = 1;
}
message ListIssuesResponse {
  // Every issue in the project; build the tree from parent_id and
  // sibling_rank.
  repeated Issue issues = 1;
}

message GetIssueRequest {
  // One of the two. A key may be an old key from before a project move.
  string id = 1;
  string key = 2;
}
message GetIssueResponse {
  Issue issue = 1;
}

message CreateIssueRequest {
  string project_id = 1;
  // Empty = a root issue.
  string parent_id = 2;
  string issue_type_id = 3;
  string summary = 4;
  string description = 5;
  // Empty = normal.
  string severity = 6;
  string assignee_id = 7;
}
message CreateIssueResponse {
  Issue issue = 1;
}

// Only the fields that are set change. An empty assignee_id unassigns.
message UpdateIssueRequest {
  string id = 1;
  int32 version = 2;
  optional string summary = 3;
  optional string description = 4;
  optional string severity = 5;
  optional string assignee_id = 6;
  // Changing type also needs the state to put the issue in, from the new
  // type's workflow (terminal if the issue is closed, otherwise not).
  optional string issue_type_id = 7;
  string state_id_in_new_type = 8;
}
message UpdateIssueResponse {
  Issue issue = 1;
}

// Re-parent and/or reorder within the project.
message MoveIssueRequest {
  string id = 1;
  // Empty = make it a root issue.
  string new_parent_id = 2;
  // Place it directly after this sibling under the new parent; empty =
  // first among its siblings.
  string after_sibling_id = 3;
}
message MoveIssueResponse {
  Issue issue = 1;
}

message MoveIssuesToProjectRequest {
  // Each moves with its whole subtree; issues inside another listed
  // issue's subtree just come along.
  repeated string issue_ids = 1;
  string target_project_id = 2;
}
message MoveIssuesToProjectResponse {
  // old key -> new key, for every issue that moved.
  map<string, string> new_keys = 1;
}

message DeleteIssuesRequest {
  // Each is deleted with its whole subtree.
  repeated string issue_ids = 1;
}
message DeleteIssuesResponse {
  int32 deleted = 1;
}

// ---------------------------------------------------------------------------
// Transitions, comments, links and history.

message TransitionIssueRequest {
  string id = 1;
  int32 version = 2;
  string to_state_id = 3;
  // Required when to_state_id is terminal, empty otherwise:
  // completed | wont_complete | obsolete | already_addressed
  string end_reason = 4;
  string end_description = 5;
}
message TransitionIssueResponse {
  Issue issue = 1;
}

message Comment {
  string id = 1;
  string issue_id = 2;
  string body = 3;
  string created_at = 4;
  string created_by = 5;
  // Empty until the first edit.
  string edited_at = 6;
  string edited_by = 7;
}

message ListCommentsRequest {
  string issue_id = 1;
}
message ListCommentsResponse {
  // Oldest first.
  repeated Comment comments = 1;
}

message AddCommentRequest {
  string issue_id = 1;
  string body = 2;
}
message AddCommentResponse {
  Comment comment = 1;
}

message EditCommentRequest {
  string id = 1;
  string body = 2;
}
message EditCommentResponse {
  Comment comment = 1;
}

// A link as seen from one issue. kind is from that issue's side:
// depends_on | required_by | duplicates | duplicated_by | relates_to.
message IssueLink {
  string id = 1;
  string kind = 2;
  string other_issue_id = 3;
  string other_issue_key = 4;
  string other_issue_summary = 5;
  string created_at = 6;
  string created_by = 7;
}

message ListLinksRequest {
  string issue_id = 1;
}
message ListLinksResponse {
  repeated IssueLink links = 1;
}

message AddLinkRequest {
  string issue_id = 1;
  // From issue_id's side, as in IssueLink.kind.
  string kind = 2;
  // One of the two; the key may be in any project.
  string other_issue_id = 3;
  string other_issue_key = 4;
}
message AddLinkResponse {
  IssueLink link = 1;
}

message RemoveLinkRequest {
  string id = 1;
}
message RemoveLinkResponse {}

message IssueEvent {
  string id = 1;
  string at = 2;
  string actor_id = 3;
  string actor_email = 4;
  // created | field | transition | comment_added | comment_edited |
  // link_added | link_removed
  string kind = 5;
  // For kind = field: summary | description | severity | assignee |
  // issue_type | state | parent | key
  string field = 6;
  // JSON values (a string, null, or an object for transitions/links).
  string old_value_json = 7;
  string new_value_json = 8;
}

message GetIssueHistoryRequest {
  string issue_id = 1;
}
message GetIssueHistoryResponse {
  // Oldest first.
  repeated IssueEvent events = 1;
}

service IssueService {
  rpc ListUsers(ListUsersRequest) returns (ListUsersResponse);
  rpc ListIssues(ListIssuesRequest) returns (ListIssuesResponse);
  rpc GetIssue(GetIssueRequest) returns (GetIssueResponse);
  rpc CreateIssue(CreateIssueRequest) returns (CreateIssueResponse);
  rpc UpdateIssue(UpdateIssueRequest) returns (UpdateIssueResponse);
  rpc MoveIssue(MoveIssueRequest) returns (MoveIssueResponse);
  rpc MoveIssuesToProject(MoveIssuesToProjectRequest) returns (MoveIssuesToProjectResponse);
  rpc DeleteIssues(DeleteIssuesRequest) returns (DeleteIssuesResponse);
  // Only along the workflow's transitions, only when assigned; into a
  // terminal state needs an end reason + description and all children
  // already terminal.
  rpc TransitionIssue(TransitionIssueRequest) returns (TransitionIssueResponse);
  rpc ListComments(ListCommentsRequest) returns (ListCommentsResponse);
  rpc AddComment(AddCommentRequest) returns (AddCommentResponse);
  rpc EditComment(EditCommentRequest) returns (EditCommentResponse);
  rpc ListLinks(ListLinksRequest) returns (ListLinksResponse);
  // Adding either side of a pair (depends_on / required_by, duplicates /
  // duplicated_by) creates both views; removing it removes both.
  rpc AddLink(AddLinkRequest) returns (AddLinkResponse);
  rpc RemoveLink(RemoveLinkRequest) returns (RemoveLinkResponse);
  rpc GetIssueHistory(GetIssueHistoryRequest) returns (GetIssueHistoryResponse);
}
