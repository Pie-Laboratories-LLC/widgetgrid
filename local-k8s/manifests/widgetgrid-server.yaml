# The widgetgrid-server-config ConfigMap (DATABASE_URL) is created by
# local-k8s/setup.sh, not defined here -- it needs the host's kind-network
# gateway IP computed at apply time (see setup.sh's comment on why
# host.docker.internal doesn't work). This file is just the Deployment +
# Service.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: widgetgrid-server
  namespace: widgetgrid
  labels:
    app: widgetgrid-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: widgetgrid-server
  template:
    metadata:
      labels:
        app: widgetgrid-server
      annotations:
        # The mechanism under test: Consul's mutating webhook injects an
        # Envoy sidecar into this pod and registers "widgetgrid-server"
        # (from the Service name below) in Consul's catalog.
        consul.hashicorp.com/connect-inject: "true"
        # The Envoy sidecar's resources, requests equal to limits -- with
        # the server's below and the injector's init container
        # (consul-values.yaml), every container in the pod is, so the pod
        # is Guaranteed QoS: the last the kernel's OOM killer picks when
        # Docker Desktop's VM runs short (image builds in setup.sh, the
        # creature service's bakes), not the first. Uses ~50MB idle.
        consul.hashicorp.com/sidecar-proxy-cpu-request: "200m"
        consul.hashicorp.com/sidecar-proxy-cpu-limit: "200m"
        consul.hashicorp.com/sidecar-proxy-memory-request: "192Mi"
        consul.hashicorp.com/sidecar-proxy-memory-limit: "192Mi"
    spec:
      containers:
        - name: widgetgrid-server
          image: widgetgrid-server:local
          imagePullPolicy: IfNotPresent # loaded via `kind load docker-image`, never pulled from a registry
          ports:
            - containerPort: 50051
              name: grpc
          # Uploaded images (mediaStore.js): /app isn't writable by the
          # image's user, and nothing here needs them to outlive the pod.
          env:
            - name: MEDIA_DIR
              value: /tmp/widgetgrid-media
            # The runtime configuration (feature flags) is read from the
            # cluster's Consul -- packages/server/src/siteConfig.js.
            - name: CONSUL_HTTP_ADDR
              value: http://consul-server.consul.svc:8500
          envFrom:
            - configMapRef:
                name: widgetgrid-server-config
          # Requests equal to limits (Guaranteed QoS -- see the sidecar's
          # annotations above). ~65MB idle; room for uploads and bursts.
          resources:
            requests: { cpu: "1", memory: 512Mi }
            limits: { cpu: "1", memory: 512Mi }
          # No application-level health endpoint exists yet (would need the
          # standard grpc.health.v1.Health service implemented server-side
          # for a native k8s grpc: probe) -- a bare TCP check is a
          # reasonable stand-in that needs no server code changes.
          readinessProbe:
            tcpSocket: { port: 50051 }
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            tcpSocket: { port: 50051 }
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: widgetgrid-server
  namespace: widgetgrid
spec:
  selector:
    app: widgetgrid-server
  ports:
    - port: 50051
      targetPort: 50051
      name: grpc
