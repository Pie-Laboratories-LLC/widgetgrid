# The Last Naming's magic service (~/GIT/c-libraries/magie/service,
# docs/service-magie.md): the maze model of magic -- POST /mage, /voir,
# /tracer, /lancer, GET /health. Image built and pushed by infra/eks/deploy.sh
# from c-libraries' Dockerfile.service-magie (nothing third-party to compile:
# about 35 s). Same Consul Connect pattern as service-grammar.yaml:
# envoy-gateway reaches it through its own connect-service-upstreams entry
# (127.0.0.1:5183), and routes /magie/... to it (envoy-eks.yaml).
#
# HOTE stays 127.0.0.1 (the image's default): only this pod's sidecar,
# which forwards inbound mesh traffic to localhost, can reach it.
#
# CORS=non: the gateway answers CORS (envoy-eks.yaml).
#
# Stateless by design: the game sends the mage with each request and
# keeps what comes back. Hence replicas: 2 -- any replica can answer, a
# restart loses nothing. The maze is built at start-up from
# donnees/magie/tisserie.json, in a few milliseconds; a few MiB.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: service-magie
  namespace: widgetgrid
  labels:
    app: service-magie
spec:
  replicas: 2
  selector:
    matchLabels:
      app: service-magie
  template:
    metadata:
      labels:
        app: service-magie
      annotations:
        consul.hashicorp.com/connect-inject: "true"
    spec:
      containers:
        - name: service-magie
          image: ${MAGIE_IMAGE}
          imagePullPolicy: Always
          env:
            - { name: PORT, value: "5183" }
            - { name: HOTE, value: "127.0.0.1" }
            - { name: CORS, value: "non" }
          ports:
            - containerPort: 5183
              name: http
          resources:
            requests: { cpu: 50m, memory: 32Mi }
            limits: { memory: 128Mi }
          readinessProbe:
            httpGet: { path: /health, port: 5183 }
            initialDelaySeconds: 1
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: 5183 }
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: service-magie
  namespace: widgetgrid
spec:
  selector:
    app: service-magie
  ports:
    - port: 5183
      targetPort: 5183
      name: http
---
# protocol: http -- plain HTTP/1.1 requests and replies.
apiVersion: consul.hashicorp.com/v1alpha1
kind: ServiceDefaults
metadata:
  name: service-magie
  namespace: widgetgrid
spec:
  protocol: http
