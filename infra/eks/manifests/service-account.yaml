# Dedicated ServiceAccount for widgetgrid-server (not the namespace's
# default one) -- what infra/cdk/lib/eks-stack.js's
# WidgetgridServerSnsPodIdentity binds its sns:Publish-permissioned IAM
# role to. Using a dedicated SA rather than binding to `default` keeps that
# permission scoped to just this Deployment's pods, not every pod in the
# namespace that happens to use the default SA (static-server,
# envoy-gateway have no business calling SNS).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: widgetgrid-server
  namespace: widgetgrid
